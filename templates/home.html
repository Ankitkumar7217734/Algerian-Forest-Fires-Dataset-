<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWI Prediction App</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fb;
        color: #1f2937;
      }

      .login {
        width: min(92vw, 420px);
        padding: 28px;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        text-align: center;
      }

      form {
        display: grid;
        gap: 10px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      }

      button {
        margin-top: 6px;
        padding: 11px 14px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      h2 {
        margin-top: 18px;
        font-size: 16px;
        text-align: center;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <h1>FWI Prediction App</h1>

      <form action="{{url_for('predict_datapoint')}}" method="post">
        <input
          type="text"
          name="Temperature"
          placeholder="Temperature"
          required
        />
        <input type="text" name="RN" placeholder="RN" required />
        <input type="text" name="WS" placeholder="WS" required />
        <input type="text" name="Rain" placeholder="Rain" required />
        <input type="text" name="FFMC" placeholder="FFMC" required />
        <input type="text" name="DMC" placeholder="DMC" required />
        <input type="text" name="ISI" placeholder="ISI" required />
        <input type="text" name="Classes" placeholder="Classes" required />
        <input type="text" name="Region" placeholder="Region" required />
        <button type="submit" class="btn btn-primary btn-block btn-large">
          Predict
        </button>
      </form>
      <h2>The predicted Fire Weather Index (FWI) is: {{ result }}</h2>
    </div>
  </body>
</html>
